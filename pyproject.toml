[project]
name = "solarphunk"
version = "0.1.0"
description = "Model-agnostic deep agent built on langchain-ai/deepagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.1",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
solarphunk = "solarphunk.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solarphunk"]

[tool.uv]
# Keep the lockfile in the repo so runs are reproducible.
package = true
